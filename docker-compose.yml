services:
  scripter:
    image: ${SCRIPTER_IMAGE:?Set SCRIPTER_IMAGE in .env}
    container_name: Scripter_8010
    restart: unless-stopped
    user: "1000:1000"
    env_file:
      - .env
    environment:
      DATA_DIR: /usr/src/app/data
    ports:
      - "${SCRIPTER_PORT:-8010}:8000"
    volumes:
      # Persistent application state: SQLite database + generated secret_key.
      - ./data:/usr/src/app/instance
      # User-authored scripts and execution logs.
      - ./scripts:/usr/src/app/data
      # SSH material is read-only inside the container.
      - ./keys:/run/scripter/keys:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
