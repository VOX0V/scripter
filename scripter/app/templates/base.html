<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}scripter{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <style>
        :root {
            --bg: #14181f;
            --bg-card: #1c222c;
            --border: #2a3140;
            --text: #e4e8ef;
            --text-dim: #8a93a6;
            --accent: #4a90e2;
            --green: #3ecf8e;
            --red: #e25c5c;
            --yellow: #e2b74a;
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }
        nav a { color: var(--text); text-decoration: none; margin-left: 16px; font-size: 14px; }
        nav a:hover { color: var(--accent); }
        .brand { font-weight: 600; font-size: 16px; }
        .brand span { color: var(--text-dim); font-weight: 400; font-size: 12px; }
        main { max-width: 1400px; margin: 0 auto; padding: 24px 16px; }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 20px;
        }
        h1, h2, h3 { margin-top: 0; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
        th { color: var(--text-dim); font-weight: 500; font-size: 12px; text-transform: uppercase; }
        select, input[type=text], input[type=password] {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
        }
        label { font-size: 13px; color: var(--text-dim); display: block; margin-bottom: 4px; margin-top: 10px; }
        button, .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        button.secondary, .btn.secondary { background: var(--border); }
        button.danger, .btn.danger { background: var(--red); }
        .badge { padding: 3px 8px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .badge.online { background: rgba(62,207,142,0.15); color: var(--green); }
        .badge.offline { background: rgba(226,92,92,0.15); color: var(--red); }
        .badge.running { background: rgba(226,183,74,0.15); color: var(--yellow); }
        .badge.success { background: rgba(62,207,142,0.15); color: var(--green); }
        .badge.error { background: rgba(226,92,92,0.15); color: var(--red); }
        .error-msg { color: var(--red); font-size: 14px; margin-top: 10px; }
        .empty { color: var(--text-dim); font-size: 14px; font-style: italic; }
        pre.log {
            background: #0c0f14;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            font-size: 13px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .launch-row {
            display: flex;
            gap: 16px;
            align-items: stretch;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .launch-col {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            min-width: 170px;
            flex: 0 0 auto;
        }
        .launch-col-title {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-dim);
            margin: 0 0 8px;
            font-weight: 600;
        }
        .server-tile-v {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            cursor: pointer;
            font-size: 13px;
        }
        .server-tile-v input { width: auto; }
        .server-name { display: block; font-weight: 500; }
        .server-tile-v .badge { margin-top: 2px; display: inline-block; }
        .script-option {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            padding: 4px 0;
            cursor: pointer;
        }
        .script-option input { width: auto; }
        .launch-recap-col {
            min-width: 190px;
            display: flex;
            flex-direction: column;
        }
        .recap-line {
            font-size: 13px;
            margin: 0 0 10px;
        }
        .recap-line strong {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-dim);
            font-weight: 600;
        }
        .launch-recap-col button {
            margin-top: auto;
            padding: 12px 10px;
            font-size: 15px;
        }
        .preview-full {
            margin-top: 16px;
        }
        .script-preview-box {
            background: #0c0f14;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            font-size: 12px;
            margin: 0;
            width: 100%;
            min-height: 260px;
            max-height: 520px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--text-dim);
        }
    </style>
</head>
<body>
    {% if current_user.is_authenticated %}
    <nav>
        <div class="brand">scripter <span>v{{ config["APP_VERSION"] }}</span></div>
        <div>
            <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
            {% if current_user.is_admin %}
            <a href="{{ url_for('admin.admin_home') }}">Admin</a>
            {% endif %}
            <form method="POST" action="{{ url_for('auth.logout') }}" style="display:inline; margin-left:16px;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" style="background:none; padding:0; color:var(--text);">Déconnexion ({{ current_user.username }})</button>
            </form>
        </div>
    </nav>
    {% endif %}
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
